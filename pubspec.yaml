name: nchemty_mobile
description: Nchemty Credit Union mobile banking app (iOS + Android) on Cyclos 4.16.17.
publish_to: "none"
# Must be above the live App Store version (1.0) to ship as an update.
version: 1.1.0+2

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  mobile_scanner: ^7.4.1
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
